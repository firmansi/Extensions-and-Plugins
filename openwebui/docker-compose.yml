version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - openwebui-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - openwebui-network

  # ChromaDB Vector Store
  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - ./data/chroma:/app/chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: "8000"
    networks:
      - openwebui-network

  # Custom MCP Server (opsional — tidak lagi menjadi dependensi)
  # Custom MCP Server (opsional — tidak lagi menjadi dependensi)
  mcp-server:
    image: python:3.11-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./mcp-server:/app
    command: >
      sh -c "
        pip install --upgrade pip &&
        pip install fastapi uvicorn modelcontextprotocol &&
        uvicorn mcp_server:app --host 0.0.0.0 --port 8000 --reload
      "
    networks:
      - openwebui-network

  # Open WebUI — NAMA SERVICE HARUS "open-webui" (dengan tanda hubung!)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    depends_on:   # ← HAPUS mcp-server dari sini
      - db
      - redis
      - chroma
    environment:
      - WEBUI_HOSTNAME=0.0.0.0
      - WEBUI_BASE_URL=https://dialogv.matasigma.com
      - WEBUI_API_BASE_URL=https://dialogv.matasigma.com/api/v1
      - WEBUI_NAME=${PUBLIC_WEBUI_NAME}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - DB_TYPE=${DB_TYPE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OLLAMA_API_BASE_URL=${OLLAMA_API_BASE_URL}
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH}
      - VECTOR_STORE=${VECTOR_STORE}
      - CHROMA_HOST=${CHROMA_HOST}
      - CHROMA_PORT=${CHROMA_PORT}
      - CHROMA_PATH=${CHROMA_PATH}
      - ENABLE_TEMPORARY_CHAT=${ENABLE_TEMPORARY_CHAT}
      - ENABLE_MODEL_SELECTOR=${ENABLE_MODEL_SELECTOR}
      - ENABLE_FILE_UPLOAD=${ENABLE_FILE_UPLOAD}
      - ENABLE_SIGNUP=${ENABLE_SIGNUP}
      - USER_ROLE=${USER_ROLE}
      - LDAP_ENABLED=${LDAP_ENABLED}
      - LDAP_SERVER=${LDAP_SERVER}
      - LDAP_BIND_DN=${LDAP_BIND_DN}
      - LDAP_BIND_PASSWORD=${LDAP_BIND_PASSWORD}
      - LDAP_USERS_DN=${LDAP_USERS_DN}
      - LDAP_GROUPS_DN=${LDAP_GROUPS_DN}
      - LDAP_USER_OBJECTCLASS=${LDAP_USER_OBJECTCLASS}
      - LDAP_USERNAME_ATTRIBUTE=${LDAP_USERNAME_ATTRIBUTE}
      - LDAP_RDN_ATTRIBUTE=${LDAP_RDN_ATTRIBUTE}
      - LDAP_UUID_ATTRIBUTE=${LDAP_UUID_ATTRIBUTE}
      - LDAP_USER_FILTER=${LDAP_USER_FILTER}
      - MCP_SERVER_CUSTOM_URL=${MCP_SERVER_CUSTOM_URL}  # ← Tetap ada, hanya URL referensi
    volumes:
      - ./static:/app/static
    networks:
      - openwebui-network

networks:
  openwebui-network:
    driver: bridge
